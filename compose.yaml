services:
  api:
    image: api
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Data Source=/app/data/mpdca-development.db}
      ConnectionStrings__Logging: ${LOGGING_DB_CONNECTION_STRING:-}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-do-not-use-in-production-min-32-chars}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      EmailProvider__Provider: ${EMAIL_PROVIDER:-Fake}
      EmailProvider__ApiKey: ${BREVO_API_KEY:-}
      EmailProvider__DefaultSenderEmail: ${EMAIL_SENDER_ADDRESS:-no-reply@example.invalid}
    networks:
      - default
      - kafka
    volumes:
      - api-data:/app/data

networks:
  kafka:
    external: true
    name: kafka_default

volumes:
  api-data:
