services:
  api:
    image: api
    build:
      context: .
      dockerfile: Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: ${DB_CONNECTION_STRING}
      ConnectionStrings__Logging: ${LOGGING_DB_CONNECTION_STRING}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      EmailProvider__Provider: ${EMAIL_PROVIDER:-Fake}
      EmailProvider__ApiKey: ${BREVO_API_KEY:-}
      EmailProvider__DefaultSenderEmail: ${EMAIL_SENDER_ADDRESS:-no-reply@example.invalid}
